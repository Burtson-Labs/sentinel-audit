name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  selfscan:
    # Sentinel audits Sentinel. If the tool cannot survive its own gate, the
    # claim it makes about other repositories is not worth much.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Self-scan
        id: scan
        continue-on-error: true
        run: |
          node dist/cli.js scan . \
            --profile owasp-asvs \
            --out .sentinel \
            --format md,html,json,sarif \
            --no-llm

      - name: Upload SARIF
        if: always() && hashFiles('.sentinel/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: .sentinel/report.sarif
          category: sentinel-selfscan

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfscan-${{ github.run_id }}
          path: .sentinel/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          if [ -f .sentinel/findings/index.json ]; then
            node -e "
              const d = require('./.sentinel/findings/index.json');
              const out = ['## Sentinel self-scan', '', '| status | count |', '|---|---:|'];
              for (const [k, v] of Object.entries(d.counts)) out.push('| ' + k + ' | ' + v + ' |');
              console.log(out.join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Schema validation must be clean
        run: |
          # Sentinel validating its own output is the cheapest regression test for
          # the semantic invariants; a violation here is a bug in Sentinel.
          test ! -f .sentinel/SCHEMA-VALIDATION.md || { cat .sentinel/SCHEMA-VALIDATION.md; exit 1; }

      - name: Enforce the gate
        run: test "${{ steps.scan.outcome }}" = "success"
