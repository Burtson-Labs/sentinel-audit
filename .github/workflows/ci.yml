name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  selfscan:
    # Sentinel audits Sentinel. If the tool cannot survive its own gate, the
    # claim it makes about other repositories is not worth much.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: read
      security-events: write
      actions: read # the SARIF upload reads the workflow run on private repositories
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Self-scan through the action
        # Runs action.yml against this checkout's build, so the Marketplace
        # action is exercised on every push, not just when someone adopts it.
        uses: ./
        with:
          out: .sentinel
          cli: dist/cli.js
          fail-on: findings
          sarif-category: sentinel-selfscan

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfscan-${{ github.run_id }}
          path: .sentinel/
          retention-days: 14

      - name: Schema validation must be clean
        if: always()
        run: |
          # Sentinel validating its own output is the cheapest regression test for
          # the semantic invariants; a violation here is a bug in Sentinel.
          test ! -f .sentinel/SCHEMA-VALIDATION.md || { cat .sentinel/SCHEMA-VALIDATION.md; exit 1; }
