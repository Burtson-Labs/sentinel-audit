name: publish

# Publishes @burtson-labs/sentinel-audit to npmjs on every push to main with the
# organisation's NPM_TOKEN, on a GitHub-hosted runner. The other Burtson Labs
# packages publish from the burtson-labs-runners pool; that pool does not serve
# public repositories (the GitHub default for runner groups), and the first
# publish after this repository went public sat queued for 24 hours and was
# cancelled. Nothing here needs the pool: the secret is an organisation secret,
# not a runner property. A version already on the registry is
# skipped, so only a version bump in package.json publishes, and re-running is
# safe.
#
# The shared reusable workflow (Burtson-Labs/actions build-push-pnpmjs-package)
# pins Node 18. This package needs Node 22.6 or newer for its tests and its
# proof runner, and `pnpm publish` runs them through prepublishOnly, so the same
# steps are inlined here on Node 22 rather than called through.
#
# The token is injected by setup-node into a temporary npmrc under RUNNER_TEMP
# and read only by the publish step; it is never written into the checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Skip if this version is already on the registry
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on the registry; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not on the registry; publishing"
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
