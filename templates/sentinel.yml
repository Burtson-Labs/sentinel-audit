name: sentinel audit

# Self-scan on a schedule and on pull requests, then upload SARIF so findings
# appear in the repository's Security tab.
#
# Notes:
#  - The scheduled run is what keeps dependency advisories current; the PR run
#    is what stops new findings landing.
#  - `--no-llm` keeps CI deterministic and offline-friendly. Drop it (and supply
#    a provider key) if you want the model-assisted review pass in CI too.
#  - Exit code 2 means the profile gate blocked. `continue-on-error` is set on
#    the scan step only so the SARIF still uploads; the final step re-asserts the
#    failure, so the check still fails. Removing that step turns the gate off.

on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read # the SARIF upload reads the workflow run on private repositories

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so secret scanning can see it

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
        continue-on-error: true # a failed install only costs advisory/licence depth

      - name: Run sentinel
        id: sentinel
        continue-on-error: true
        run: |
          npx --yes @burtson-labs/sentinel-audit scan . \
            --profile owasp-asvs \
            --out sentinel-results \
            --format md,html,json,sarif \
            --no-llm

      - name: Upload SARIF to code scanning
        # A convenience, not the gate: a private repository without Advanced
        # Security cannot accept code-scanning uploads, and that must not mask
        # the scan result asserted below.
        if: always() && hashFiles('sentinel-results/report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: sentinel-results/report.sarif
          category: sentinel-audit

      - name: Upload full artefact set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-audit-${{ github.run_id }}
          path: sentinel-results/
          retention-days: 30

      - name: Summarise
        if: always()
        run: |
          if [ -f sentinel-results/findings/index.json ]; then
            node -e "
              const d = require('./sentinel-results/findings/index.json');
              const c = d.counts;
              console.log('## Sentinel audit');
              console.log('');
              console.log('| status | count |');
              console.log('|---|---:|');
              for (const [k, v] of Object.entries(c)) console.log('| ' + k + ' | ' + v + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce the gate
        if: always()
        run: |
          # Re-assert the scan's exit status after the SARIF upload, so a blocked
          # gate fails the check rather than being swallowed by continue-on-error.
          test "${{ steps.sentinel.outcome }}" = "success"
